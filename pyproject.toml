[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2"
version = "0.1.0"
description = "One Python API for a simulated or real Unitree Go2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=10"]
web = ["pillow>=10"]
# Everything a laptop needs to run the same lab the server runs: the
# simulator service, JupyterLab, and the proxy that lets one page frame both.
lab = [
    "pillow>=10",
    "jupyterlab>=4.1",
    "jupyter-server-proxy>=4.1",
    "notebook>=7",
    "ipywidgets>=8",
]

[project.scripts]
go2-lab = "go2.desktop:main"
go2-run = "go2.desktop:run_script"

[tool.setuptools.packages.find]
include = ["go2*"]

[tool.setuptools.package-data]
go2 = [
    "assets/*.xml",
    "assets/assets/*",
    "assets/LICENSE",
    "assets/UPSTREAM_README.md",
    # Course material travels with the package, so a pip install from GitHub
    # gives a student the notebooks too -- no second download, and the hosted
    # labs seed from the same copy.
    "coursework/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
