[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2"
version = "0.1.0"
description = "One Python API for a simulated or real Unitree Go2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=10"]
web = ["pillow>=10"]
# The classroom site: the console, the student pages and the installer
# mirror. Deliberately NOT part of `lab`: a student installing the simulator
# on their own laptop should not be made to install a web framework.
classroom = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "authlib>=1.3",
    "httpx>=0.27",
]
# Everything a laptop needs to run the same lab the server runs: the
# simulator service, JupyterLab, and the proxy that lets one page frame both.
lab = [
    "pillow>=10",
    "jupyterlab>=4.1",
    "jupyter-server-proxy>=4.1",
    "notebook>=7",
    "ipywidgets>=8",
]

[project.scripts]
go2-lab = "go2.desktop:main"
go2-run = "go2.desktop:run_script"
go2-course = "go2.course:main"

[tool.setuptools.packages.find]
include = ["go2*"]

[tool.setuptools.package-data]
go2 = [
    "assets/*.xml",
    "assets/*.css",
    "assets/assets/*",
    "assets/LICENSE",
    "assets/UPSTREAM_README.md",
    # Course material travels with the package, so a pip install from GitHub
    # gives a student the notebooks too -- no second download, and the hosted
    # labs seed from the same copy.
    "course_pack/course.toml",
    "course_pack/units/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
