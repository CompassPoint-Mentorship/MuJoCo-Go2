# JupyterHub for the online labs.
#
#   cd deploy/hub && docker compose up -d --build
#
# Trial: the hub's proxy listens on 8600 and passes everything outside /labs/
# to the classroom site, so http://<host>:8600/ is the whole site plus labs.
# Cut-over moves this proxy to 8500 and the classroom app behind it.
services:
  hub:
    build: .
    image: go2-hub:latest
    container_name: go2-hub
    restart: unless-stopped
    networks: [go2-hub]
    ports:
      - "${HUB_PUBLIC_PORT:-8600}:${HUB_PUBLIC_PORT:-8600}"
    env_file:
      - ../../.env
    environment:
      HUB_PUBLIC_PORT: "${HUB_PUBLIC_PORT:-8600}"
      CLASSROOM_URL: "${CLASSROOM_URL:-http://192.168.1.215:8500}"
      WORK_ROOT: /srv/MuJoCo-Go2/student-work
      DOCKER_NETWORK_NAME: go2-hub
    volumes:
      # DockerSpawner starts lab containers; like the classroom container,
      # this is root on the host in all but name.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/srv/jupyterhub/data
      # Same path inside and out: the host daemon resolves the bind mounts.
      - /srv/MuJoCo-Go2/student-work:/srv/MuJoCo-Go2/student-work

networks:
  go2-hub:
    name: go2-hub
