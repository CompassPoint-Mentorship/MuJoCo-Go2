# One student's JupyterLab + simulator.
# Driven by ./go2-student.sh, which supplies the env file and project name:
#   ./go2-student.sh up alice
services:
  lab:
    image: go2-lab:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: go2-lab-${STUDENT}
    restart: unless-stopped
    ports:
      - "${LAB_PORT}:8888"
    environment:
      # Per-student token: this is what makes the link a login.
      JUPYTER_TOKEN: ${LAB_TOKEN}
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      # Never 1 on a shared server. See deploy/README.md.
      GO2_ALLOW_REAL: "0"
      # Notebooks connect to the service the entrypoint starts, rather than
      # each creating their own dog inside the kernel.
      GO2_SIM_URL: http://127.0.0.1:8399
    volumes:
      - ${STUDENT_WORK}:/home/student/work:rw
      # Self-signed TLS, shared by every student. Generate with
      # ./make-cert.sh; without it the lab falls back to HTTP and the
      # microphone (voice recording) is blocked by the browser.
      - ./tls:/etc/go2/tls:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [graphics, compute, utility]
